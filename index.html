<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Counter Reveal Preloader — прелоадер со счётчиком, после которого изображение и текст раскрываются как в кино, на GSAP."
    />
    <title>Counter Reveal Preloader</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      href="fonts/LK_Ternima-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="style.css" />

    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/CustomEase.min.js"
      defer
    ></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="preloader-counter" aria-hidden="true">
      <div class="preloader-value">0</div>
    </div>

    <header class="header">
      <div class="header-logo">
        <a href="#">Canon</a>
      </div>
      <nav class="header-links" aria-label="Main menu">
        <a href="#">Index</a>
        <a href="#">Collection</a>
        <a href="#">Material</a>
        <a href="#">Process</a>
        <a href="#">About</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="hero-bg">
          <img src="images/image-01.webp" alt="" width="720" height="452" />
        </div>

        <div class="hero-header">
          <h1>Canon</h1>
        </div>

        <div class="hero-footer">
          <p>Performance</p>
          <p>Craftsmanship</p>
          <p>Experience</p>
        </div>

        <div class="progress-bar" aria-hidden="true">
          <div class="progress"></div>
        </div>
      </section>
    </main>
  </body>
</html>
